[package]
name = "gnome-clip-notes"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A private clipboard and Markdown notebook for GNOME"
default-run = "gnome-clip-notes"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soup = { package = "soup3", version = "0.9" }
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
pulldown-cmark = "0.12"
webkit = { package = "webkit6", version = "0.6" }

[profile.release]
lto = "thin"
strip = true
