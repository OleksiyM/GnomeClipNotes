[package]
name = "gcn-webkit-preview-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["web"]
web = ["dep:webkit"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"
pulldown-cmark = "0.12"
serde_json = "1"
webkit = { package = "webkit6", version = "0.6", optional = true }

[profile.release]
lto = "thin"
strip = true
