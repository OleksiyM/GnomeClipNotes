name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora:
    name: Fedora 44 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    env:
      GCN_PACKAGE_OS_ID: fedora
      GCN_PACKAGE_OS_VERSION: "44"
      GCN_PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - run: dnf install -y git cargo rust rustfmt clippy gtk4-devel libadwaita-devel libsoup3-devel webkitgtk6.0-devel gettext desktop-file-utils findutils tar gzip python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify translation extraction with Rust-capable gettext
        run: ./scripts/translations.py check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test and assemble archive
        run: ./scripts/build-package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-clip-notes-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
